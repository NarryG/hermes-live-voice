[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-live-voice-discord-media"
version = "0.3.0+buffer.1"
requires-python = ">=3.11"
description = "Host-selected subscription broker and native Discord direct WebRTC media"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE.md", "licenses/Codex-Apache-2.0.txt"]
dependencies = [
  "aiortc==1.15.0",
  "av==17.1.0",
  "aiohttp>=3.13,<4",
  "discord.py[voice]==2.7.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "fastapi>=0.115,<1", "pyyaml>=6,<7"]

[tool.setuptools]
packages = ["discord_voice"]
